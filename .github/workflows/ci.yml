# Runs on every push to main and on pull requests into it. Four independent jobs:
#   typecheck + unit tests · Postgres race tests · Firestore/Storage rules and emulator tests · functions bundle
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Cloud Functions runs Node 22 (functions/package.json engines).
  NODE_VERSION: '22'

jobs:
  unit:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - name: Install
        run: corepack pnpm install --frozen-lockfile
      - name: Typecheck (shared, functions, portal)
        run: corepack pnpm typecheck
      - name: Unit tests (ledger on in-process PGlite)
        run: corepack pnpm test

  postgres:
    name: Postgres race tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: susu
          POSTGRES_PASSWORD: susu-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U susu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database; used by dropdb/createdb and the tests.
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: susu
      PGPASSWORD: susu-ci-only
      TEST_DATABASE_URL: postgresql://susu:susu-ci-only@localhost:5432/susu_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - name: Install
        run: corepack pnpm install --frozen-lockfile
      - name: Postgres client tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Concurrency and bank race tests (real Postgres)
        run: corepack pnpm test:pg

  rules:
    name: Rules and emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: corepack enable
      - name: Install
        run: corepack pnpm install --frozen-lockfile
      - name: Firebase CLI
        run: npm install -g firebase-tools@15.18.0
      - name: Cache emulator downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.18.0
      - name: Firestore and Storage rules, sweeper and dashboard emulator tests (demo- project, no credentials)
        run: corepack pnpm test:rules

  build:
    name: Functions bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - name: Install
        run: corepack pnpm install --frozen-lockfile
      - name: Bundle functions
        run: corepack pnpm --filter @susu/functions build
      - name: Bundle loads
        working-directory: functions
        run: node -e "import('./lib/index.js').then(m => console.log(Object.keys(m).length + ' functions exported'))"
